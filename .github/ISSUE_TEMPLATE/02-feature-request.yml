
name: Feature Request
description: Proponer una nueva funcionalidad para NovaStock.
title: "[FEATURE] "
labels:
  - "type: feature"
body:
  - type: markdown
    attributes:
      value: |
        Describe la funcionalidad que propones y el problema que resolvería.

  - type: textarea
    id: problem
    attributes:
      label: Problema o necesidad
      description: ¿Qué problema queremos resolver?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solución propuesta
      description: ¿Cómo imaginas que debería funcionar?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: ¿Existen otras formas de resolver el problema?
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: ¿Cómo sabremos que la funcionalidad está terminada?
      placeholder: |
        - [ ] Criterio 1
        - [ ] Criterio 2
    validations:
      required: true
