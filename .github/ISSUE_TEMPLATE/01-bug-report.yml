
name: Bug Report
description: Reportar un error o comportamiento inesperado en NovaStock.
title: "[BUG] "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar este error.
        Proporciona la información necesaria para reproducirlo.

  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: Explica qué está ocurriendo.
      placeholder: Describe el error...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Indica cómo podemos provocar el error.
      placeholder: |
        1. Abrir...
        2. Seleccionar...
        3. Presionar...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: ¿Qué debería suceder?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento obtenido
      description: ¿Qué sucedió realmente?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidencias
      description: Adjunta capturas, registros o mensajes de error.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Indica sistema operativo, navegador o versión afectada.
      placeholder: macOS, Chrome...
    validations:
      required: false
